<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Realista - Movimento Ultra Flexível & Fluido</title>
  <style>
    :root {
      --bg-color: #070913;
      --panel-bg: rgba(18, 22, 41, 0.85);
      --accent-color: #00ffaa;
      --glow-color: rgba(0, 255, 170, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 30%, #111a36 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, #1f0a21 0%, transparent 50%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      margin-bottom: 12px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .score-box {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .score-box span {
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--glow-color);
      font-size: 1.1rem;
    }

    .canvas-wrapper {
      position: relative;
      border-radius: 16px;
      padding: 4px;
      background: linear-gradient(135deg, rgba(0, 255, 170, 0.4), rgba(255, 0, 85, 0.4));
      box-shadow: 0 0 35px rgba(0, 255, 170, 0.2);
    }

    canvas {
      background: #090c18;
      border-radius: 12px;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 9, 19, 0.88);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .overlay h1 {
      font-size: 2.2rem;
      color: #ff0055;
      text-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .overlay p {
      font-size: 1.1rem;
      margin-bottom: 25px;
      color: #ccc;
    }

    .btn-restart {
      background: linear-gradient(45deg, #00ffaa, #00b3ff);
      color: #000;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px var(--glow-color);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-restart:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px var(--glow-color);
    }

    .instructions {
      margin-top: 12px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <header>
      <div class="score-box">PONTOS: <span id="score">0</span></div>
      <div class="score-box">NÍVEL: <span id="level" style="color: #ffdd00;">1</span></div>
      <div class="score-box">RECORDE: <span id="highScore">0</span></div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      
      <div class="overlay" id="gameOverModal">
        <h1>Fim de Jogo!</h1>
        <p>Pontuação: <span id="finalScore" style="color: #00ffaa;">0</span> | Nível: <span id="finalLevel" style="color: #ffdd00;">1</span></p>
        <button class="btn-restart" onclick="resetGame()">JOGAR NOVAMENTE</button>
      </div>
    </div>

    <p class="instructions">Sinta a extrema fluidez! Curvas orgânicas usando Inverse Kinematics e Bezier Curves.</p>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const finalLevelEl = document.getElementById('finalLevel');
    const modal = document.getElementById('gameOverModal');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    // Estado do Jogo (Grade Lógica)
    let snakeGrid = [];
    let food = { x: 0, y: 0 };
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let score = 0;
    let level = 1;
    let itemsEaten = 0;
    let moveProgress = 0;
    let stepDuration = 180;
    let lastTime = 0;
    let highScore = localStorage.getItem('snake_highscore_smooth') || 0;
    let particles = [];
    let isGameOver = false;
    let animationFrameId = null;

    // --- CADEIA DE CINEMÁTICA PARA SUEVIDADE/FLEXIBILIDADE ABSOLUTA ---
    let joints = []; 
    const segmentDistance = 6; // Distância ultra-curta entre articulações para corpo orgânico
    let targetHeadPos = { x: 0, y: 0 };
    let headAngle = 0;

    highScoreEl.innerText = highScore;

    function initGame() {
      snakeGrid = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 },
        { x: 5, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      level = 1;
      itemsEaten = 0;
      stepDuration = 180;
      moveProgress = 0;

      // Inicializa joints contínuos ao longo dos blocos
      initJoints();

      scoreEl.innerText = score;
      levelEl.innerText = level;
      isGameOver = false;
      modal.classList.remove('active');
      
      spawnFood();
      lastTime = performance.now();
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    function initJoints() {
      joints = [];
      const numSegments = (snakeGrid.length - 1) * Math.round(gridSize / segmentDistance) + 1;
      const startX = snakeGrid[0].x * gridSize + gridSize / 2;
      const startY = snakeGrid[0].y * gridSize + gridSize / 2;
      
      for (let i = 0; i < numSegments; i++) {
        joints.push({
          x: startX - i * segmentDistance,
          y: startY
        });
      }
      targetHeadPos = { x: startX, y: startY };
      headAngle = 0;
    }

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);

      snakeGrid.forEach(segment => {
        if (segment.x === food.x && segment.y === food.y) {
          spawnFood();
        }
      });
    }

    function gameLoop(now) {
      if (isGameOver) return;

      const dt = now - lastTime;
      lastTime = now;

      update(dt);
      draw();

      if (!isGameOver) {
        animationFrameId = requestAnimationFrame(gameLoop);
      }
    }

    function update(dt) {
      moveProgress += dt / stepDuration;

      if (moveProgress >= 1) {
        moveProgress -= 1;
        advanceLogicStep();
      }

      updateFlexiblePhysics();
      updateParticles();
    }

    function advanceLogicStep() {
      dir = { ...nextDir };
      const head = { x: snakeGrid[0].x + dir.x, y: snakeGrid[0].y + dir.y };

      // Colisão com paredes
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Colisão com o próprio corpo
      for (let i = 0; i < snakeGrid.length; i++) {
        if (head.x === snakeGrid[i].x && head.y === snakeGrid[i].y) {
          gameOver();
          return;
        }
      }

      snakeGrid.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        itemsEaten++;
        scoreEl.innerText = score;

        if (itemsEaten % 5 === 0) {
          level++;
          levelEl.innerText = level;
          stepDuration = Math.max(60, 180 - (level - 1) * 15);
        }

        if (score > highScore) {
          highScore = score;
          highScoreEl.innerText = highScore;
          localStorage.setItem('snake_highscore_smooth', highScore);
        }

        // Adiciona novas articulações ao final da cobrinha ao crescer
        const extraJoints = Math.round(gridSize / segmentDistance);
        const lastJ = joints[joints.length - 1];
        for(let j = 0; j < extraJoints; j++) {
          joints.push({ x: lastJ.x, y: lastJ.y });
        }

        createExplosion(food.x * gridSize, food.y * gridSize, '#ff3366');
        spawnFood();
      } else {
        snakeGrid.pop();
      }
    }

    // --- SIMULAÇÃO DE CINEMÁTICA INVERSA / VERLET PARA FLEXIBILIDADE ---
    function updateFlexiblePhysics() {
      if (snakeGrid.length < 2) return;

      // Interpolação suave da posição exata da cabeça
      const headCurr = snakeGrid[0];
      const headNext = { x: headCurr.x + nextDir.x, y: headCurr.y + nextDir.y };

      const headTargetPx = {
        x: (headCurr.x + (headNext.x - headCurr.x) * moveProgress) * gridSize + gridSize / 2,
        y: (headCurr.y + (headNext.y - headCurr.y) * moveProgress) * gridSize + gridSize / 2
      };

      // A cabeça lidera a cadeia
      joints[0].x = headTargetPx.x;
      joints[0].y = headTargetPx.y;

      // Calcula o ângulo da cabeça suavemente voltado para a direção de movimento
      const targetAngle = Math.atan2(nextDir.y, nextDir.x);
      let angleDiff = targetAngle - headAngle;
      
      // Normaliza a diferença do ângulo entre -PI e PI
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      headAngle += angleDiff * 0.25; // Rotação ultra fluida da cabeça

      // As articulações seguintes perseguem a da frente mantendo uma distância fixa (Fabrik / IK)
      for (let i = 1; i < joints.length; i++) {
        const prev = joints[i - 1];
        const curr = joints[i];

        const dx = prev.x - curr.x;
        const dy = prev.y - curr.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 0) {
          const factor = (dist - segmentDistance) / dist;
          curr.x += dx * factor;
          curr.y += dy * factor;
        }
      }
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 20; i++) {
        particles.push({
          x: x + gridSize / 2,
          y: y + gridSize / 2,
          dx: (Math.random() - 0.5) * 8,
          dy: (Math.random() - 0.5) * 8,
          radius: Math.random() * 3 + 1,
          color: color,
          life: 25
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.dx;
        p.y += p.dy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life / 25;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawFood() {
      const cx = food.x * gridSize + gridSize / 2;
      const cy = food.y * gridSize + gridSize / 2 + 1;
      const r = gridSize / 2 - 2;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(cx, cy + r - 1, r, r * 0.4, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fill();

      let grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
      grad.addColorStop(0, '#ff6688');
      grad.addColorStop(0.4, '#e60039');
      grad.addColorStop(1, '#80001a');

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.shadowBlur = 12;
      ctx.shadowColor = 'rgba(230, 0, 57, 0.7)';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(cx, cy - r + 1);
      ctx.quadraticCurveTo(cx + 2, cy - r - 4, cx + 4, cy - r - 5);
      ctx.strokeStyle = '#5c3a21';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(cx + 3, cy - r - 3, 3, 1.5, Math.PI / 4, 0, Math.PI * 2);
      ctx.fillStyle = '#22cc44';
      ctx.fill();

      ctx.restore();
    }

    // --- DESENHO DE CORPO CONTINUO E CURVO (BEZIER + SMOOTHING) ---
    function drawSnake() {
      if (joints.length < 2) return;

      // 1. Desenho da pele / corpo como um caminho fluido unificado
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Desenha o corpo com preenchimento contínuo e bordas arredondadas
      for (let i = joints.length - 1; i >= 0; i--) {
        const pt = joints[i];
        const progress = i / joints.length;
        const radius = Math.max(3, (gridSize / 2 - 1) * (1 - progress * 0.4));

        ctx.beginPath();
        ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);

        let bodyGrad = ctx.createRadialGradient(pt.x - 2, pt.y - 2, 1, pt.x, pt.y, radius);
        if (i < 3) {
          bodyGrad.addColorStop(0, '#55ffcc');
          bodyGrad.addColorStop(1, '#008866');
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#00ffaa';
        } else {
          bodyGrad.addColorStop(0, '#00e5ff');
          bodyGrad.addColorStop(0.7, '#006699');
          bodyGrad.addColorStop(1, '#003355');
          ctx.shadowBlur = 4;
          ctx.shadowColor = 'rgba(0, 229, 255, 0.25)';
        }

        ctx.fillStyle = bodyGrad;
        ctx.fill();
      }
      ctx.restore();

      // 2. Desenho detalhado dos Olhos na Cabeça com rotação contínua
      const head = joints[0];

      ctx.save();
      ctx.translate(head.x, head.y);
      ctx.rotate(headAngle);

      // Olho Superior
      ctx.beginPath();
      ctx.arc(4, -5, 2.8, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(5, -5, 1.2, 0, Math.PI * 2);
      ctx.fillStyle = '#000';
      ctx.fill();

      // Olho Inferior
      ctx.beginPath();
      ctx.arc(4, 5, 2.8, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(5, 5, 1.2, 0, Math.PI * 2);
      ctx.fillStyle = '#000';
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      ctx.fillStyle = '#090c18';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGrid();
      drawFood();
      drawSnake();
      drawParticles();
    }

    function gameOver() {
      isGameOver = true;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      finalScoreEl.innerText = score;
      finalLevelEl.innerText = level;
      modal.classList.add('active');
    }

    function resetGame() {
      initGame();
    }

    window.addEventListener('keydown', e => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === 'ArrowUp' && dir.y === 0) {
        nextDir = { x: 0, y: -1 };
      } else if (e.key === 'ArrowDown' && dir.y === 0) {
        nextDir = { x: 0, y: 1 };
      } else if (e.key === 'ArrowLeft' && dir.x === 0) {
        nextDir = { x: -1, y: 0 };
      } else if (e.key === 'ArrowRight' && dir.x === 0) {
        nextDir = { x: 1, y: 0 };
      }
    });

    initGame();
  </script>
</body>
</html>
